name: pages

# Publishes the download page (site/) and, under /app/, the browser version
# of the app, to GitHub Pages. In the repository settings, Pages > Source must
# be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - name: Build the browser version
        working-directory: app
        run: flutter build web --release --base-href /Salaat-Aviny-Prayer-Times/app/
      - name: Put it under site/app
        run: |
          rm -rf site/app
          cp -r app/build/web site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
