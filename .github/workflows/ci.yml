name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - name: No DateTime.now() outside the clock layer
        shell: bash
        run: |
          if grep -rn "DateTime\.now(" app/lib packages/owghat_lib/lib packages/prayer_core/lib | grep -v "// allow-now"; then
            echo "DateTime.now() is forbidden; use the injected Clock"; exit 1; fi
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: dart test
        working-directory: packages/prayer_core
      - run: flutter test
        working-directory: packages/owghat_lib
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: salaat-windows-x64
          path: app/build/windows/x64/runner/Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: app

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
        working-directory: app

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
        working-directory: app

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
        working-directory: app
      # Unsigned: proves the iOS app compiles. Installing it on a phone needs
      # an Apple developer account.
      - run: flutter build ios --release --no-codesign
        working-directory: app
