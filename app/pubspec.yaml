name: owghat
description: Salaat | Aviny Prayer Times - prayer times, azan and wake-up alarms for Windows.
publish_to: none
version: 1.1.0+3
resolution: workspace

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.1
  geolocator: ^14.0.1
  owghat_lib:
  path: ^1.9.1
  path_provider: ^2.1.6
  prayer_core:
  timezone: ^0.11.2
  tray_manager: ^0.8.3
  url_launcher: ^6.3.3
  web: ^1.1.2
  win32: ^6.4.0
  window_manager: ^0.6.0
  windows_single_instance: ^1.2.0

dev_dependencies:
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
    - assets/fonts/OFL.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
